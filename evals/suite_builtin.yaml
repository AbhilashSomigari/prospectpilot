name: prospectpilot-writer-builtin
description: "Grounded-and-passing rate of the writer\u21C4critic loop over frozen fixtures."
trials_per_task: 2
concurrency: 4
graders:
- type: json_contract
  name: json_contract
  weight: 1.0
  pass_threshold: 1.0
  config:
    required_keys:
    - emails
- type: citation_groundedness
  name: cites_known_fact
