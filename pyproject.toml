[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "prospectpilot"
version = "0.1.0"
description = "A self-improving SDR agent: ICP in, verified + researched leads and fact-grounded outreach out, with a nightly eval-gated prompt optimizer."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Abhilash Reddy Somigari" }]
dependencies = [
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
  "rich>=13,<15",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "selectolax>=0.3.21,<1",
  "beautifulsoup4>=4.12,<5",
  "trafilatura>=1.12,<3",
  "dnspython>=2.6,<3",
  "sqlalchemy[asyncio]>=2.0.30,<3",
  "alembic>=1.13,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pgvector>=0.3,<1",
  "langgraph>=0.2.60,<2",
  "langgraph-checkpoint-postgres>=2.0,<4",
  "anthropic>=0.40",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-sdk>=1.27,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
  "prometheus-client>=0.20,<1",
  "evalforge @ git+https://github.com/AbhilashSomigari/evalforge.git@a74713b",
]

[project.optional-dependencies]
langfuse = []  # Langfuse ingests OTLP directly; no extra SDK needed (see obs/tracing.py)

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-PyYAML>=6,<7",
  "types-beautifulsoup4>=4.12",
]

[project.scripts]
prospectpilot = "prospectpilot.cli.main:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/prospectpilot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008", "SIM102", "SIM108", "SIM905", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["prospectpilot"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["trafilatura.*", "pgvector.*", "selectolax.*", "evalforge.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q -m 'not integration'"
markers = [
  "integration: needs the docker-compose stack (postgres + mailpit)",
]
